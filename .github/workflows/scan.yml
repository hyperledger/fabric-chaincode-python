name: "Security vulnerability scan"

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to scan.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73f4b25eb01ab1d68c # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b936f57f0eb036e9d58a5ffff33b3338866b0ff # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The runner pre-installs outdated setuptools/wheel; pip-audit audits
          # the ENTIRE environment, so we update them to versions without CVEs.
          python -m pip install --upgrade setuptools wheel

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt

      - name: Audit installed environment
        run: pip-audit
